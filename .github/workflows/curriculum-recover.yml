name: 교육과정 수동 확인 복구

# "교육과정 변경 감지 - 수동 확인 필요"로 남은 별책을, 관리자가 공식 원문 파일만 지정하면 끝까지 처리한다(사람 손은 파일 지정뿐):
#   파싱 → 앞 판과 비교 → 검증(자동 반영과 같은 조건 + 두 공식 경로의 시행일 확인) → 새 판 기록(scheduled/active, 지금 시행 판은 그대로)
#   → 수동 확인 해제 → 카탈로그·전체 테스트 → 통과하면 커밋·배포 → 관련 이슈에 결과 댓글·닫기.
# 조건을 통과하지 못하면 아무것도 바꾸지 않고 이슈에 까닭만 남긴다. 같은 원문을 다시 넣어도 바뀌는 것이 없다(멱등).
# 지정하는 법(둘 중 하나):
#   1) 원문을 curriculum/incoming/<고시 id>/ 에 올리고, 같은 폴더 source.txt 에 받은 곳 https 주소를 적는다 → 올리면(push) 저절로 돈다.
#   2) Actions 탭에서 이 작업을 직접 실행: 고시 id · 별책 번호 · 저장소 안 파일 경로 · 받은 곳 주소. dry_run 이면 판정만 한다.
# 자세한 차례: docs/CURRICULUM-REVISION.md
on:
  push:
    branches: [main]
    paths: ['curriculum/incoming/**']
  workflow_dispatch:
    inputs:
      notice:
        description: '고시 id (예: nec-2026-1)'
        required: true
      volume:
        description: '별책 번호 (예: 15)'
        required: true
      file:
        description: '저장소 안 원문 파일 경로 (예: curriculum/incoming/nec-2026-1/별책15.hwp)'
        required: true
      url:
        description: '원문을 받은 공식 기관 https 주소'
        required: true
      dry_run:
        description: '판정만 하고 아무것도 바꾸지 않기'
        type: boolean
        default: false

# 비밀(secrets)은 쓰지 않는다 — 기본 GITHUB_TOKEN 의 권한만.
permissions:
  contents: write   # 새 판 기록을 main 에 올린다
  issues: write     # 수동 확인 이슈에 결과 댓글·닫기
  actions: write    # 배포 작업(pages.yml) 시작

# 매주 확인과 같은 묶음 — 한 번에 하나씩만(같은 기록 파일을 동시에 고치지 않게)
concurrency:
  group: curriculum-watch
  cancel-in-progress: false

jobs:
  recover:
    name: 공식 원문으로 수동 확인 복구
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: PDF 읽기 도구
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # 입력은 환경 변수로만 넘긴다(셸 명령에 끼워 넣지 않는다)
      - name: 원문 판정 → 기록
        id: recover
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          NOTICE: ${{ inputs.notice }}
          VOLUME: ${{ inputs.volume }}
          FILE: ${{ inputs.file }}
          URL: ${{ inputs.url }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/curriculum-standards.js recover-ci

      - name: (기록이 바뀌었으면) 카탈로그 다시 만들고 검사·전체 테스트
        id: test
        if: ${{ steps.recover.outputs.changed == 'true' }}
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
          node scripts/build-catalog.js
          node scripts/curriculum-standards.js --check
          node scripts/validate-content.js --quiet --seeds 100
          npx playwright test

      # 테스트를 모두 통과했을 때만 올린다(AGENTS.md 규칙 1) — 정해 둔 경로만
      - name: (통과하면) 커밋하고 배포 시작
        id: commit
        if: ${{ steps.recover.outputs.changed == 'true' && steps.test.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- curriculum/notices.json data/catalog.js
          if [ -d curriculum/standards ]; then git add -- curriculum/standards; fi
          if [ -d curriculum/history ]; then git add -- curriculum/history; fi
          git add -- curriculum/incoming
          git commit -F tmp/recover-commit.txt
          git push
          gh workflow run pages.yml --ref main

      # 커밋했으면 이슈를 닫고, 통과하지 못했으면 까닭만 댓글로(같은 내용은 한 번만)
      - name: 이슈 정리
        if: ${{ always() && inputs.dry_run != true && hashFiles('tmp/recover-result.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMMITTED: ${{ steps.commit.outcome == 'success' }}
        run: node scripts/curriculum-standards.js --finish-issues tmp/recover-result.json
