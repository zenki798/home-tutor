name: 교육과정 개정 확인·자동 반영

# 매주 월요일 아침(한국 시간 09:00), 사람 손 없이:
#   1) 국가교육위원회 법령자료에서 새 교육과정 고시를 찾아 첨부 고시문을 읽고(고시 번호·바뀐 교과·학년별 시행일·새 과목)
#      curriculum/notices.json 에 적는다 → 카탈로그를 다시 만들고 → 전체 테스트를 통과하면 → 커밋하고 → 배포를 시작한다.
#      사이트는 해당 과목·학년 학생에게 "교육과정 소식"으로 알려 준다(AI 없음).
#      이어서 고친 별책의 확정 원문을 공식 경로(국가교육위원회·국가법령정보센터·교육부)에서 찾아 성취기준을 규칙으로 비교하고,
#      판정 조건을 모두 통과할 때만 새 판을 curriculum/standards/versions/ 에 기록한다(지금 시행 판은 덮어쓰지 않음 — scheduled/active,
#      학생에게는 그 학년의 시행 학년도부터. 앞 판 보관·해시는 curriculum/history/).
#      하나라도 어기면 기존 자료를 그대로 두고 "교육과정 변경 감지 - 수동 확인 필요"로 기록하고 이슈를 연다.
#   2) 교육부 보도자료에서 개정 소식(시안·공청회 등)을 찾으면 알림(이슈)을 연다.
#   3) 저장소에 60일 동안 커밋이 없으면 GitHub 가 예약 작업을 멈추므로, 45일이 넘으면 유지 커밋을 한다.
# 학생 기기와 사이트(페이지)는 여전히 외부에 아무 요청도 보내지 않는다. 자세한 차례: docs/CURRICULUM-REVISION.md
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

# 비밀(secrets)은 쓰지 않는다 — 기본 GITHUB_TOKEN 의 권한만.
permissions:
  contents: write   # 새 고시 기록·유지 커밋을 main 에 올린다
  issues: write     # 알림(이슈)
  actions: write    # 배포 작업(pages.yml) 시작 — GITHUB_TOKEN 으로 올린 커밋은 다른 작업을 자동으로 깨우지 않는다

concurrency:
  group: curriculum-watch
  cancel-in-progress: false

jobs:
  watch:
    name: 교육과정 고시 확인·반영
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # PDF 고시문에서 글자를 꺼내는 도구(pdftotext)
      - name: PDF 읽기 도구
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # 읽지 못하면 실패로 끝나 저장소 주인에게 알림이 간다(다음 단계는 그래도 돈다)
      - name: 새 고시 찾기 → 기록 · 알림
        id: watch
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/curriculum-watch.js --update --issue

      - name: (새 고시가 있으면) 카탈로그 다시 만들고 검사·전체 테스트
        id: test
        if: ${{ always() && steps.watch.outputs.changed == 'true' }}
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
          node scripts/build-catalog.js
          node scripts/curriculum-standards.js --check
          node scripts/validate-content.js --quiet --seeds 100
          npx playwright test

      # 테스트를 모두 통과했을 때만 올린다(AGENTS.md 규칙 1). 실패하면 아무것도 올리지 않고 실행이 실패로 끝나 알림이 간다
      - name: (새 고시가 있으면) 커밋하고 배포 시작
        if: ${{ always() && steps.watch.outputs.changed == 'true' && steps.test.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- curriculum/notices.json data/catalog.js
          # 자동 반영이 있었을 때만 생기는 폴더(기준 자료·보관본·기록) — 정해 둔 경로만 올린다
          if [ -d curriculum/standards ]; then git add -- curriculum/standards; fi
          if [ -d curriculum/history ]; then git add -- curriculum/history; fi
          git commit -F tmp/curriculum-watch-commit.txt
          git push
          gh workflow run pages.yml --ref main

      - name: 예약 작업 유지(60일 규칙)
        id: keep
        if: ${{ always() }}
        run: node scripts/curriculum-watch.js --keepalive

      - name: (필요하면) 유지 커밋
        if: ${{ always() && steps.keep.outputs.keepalive == 'true' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase --quiet
          git add .github/curriculum-watch-status.json
          git commit -m "교육과정 확인 작업 유지(커밋 없이 60일이면 GitHub 가 예약 작업을 멈춤)"
          git push
